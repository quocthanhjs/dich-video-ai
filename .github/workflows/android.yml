
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract outer source
        run: unzip -q dich-video-ai-source-v0.2.zip

      - name: Extract Android project
        run: unzip -q dich-video-ai-main/DichVideoAI-Android-source.zip

      - name: Verify Android project
        run: |
          test -f DichVideoAI-Android/settings.gradle.kts
          test -f DichVideoAI-Android/app/build.gradle.kts
          test -f DichVideoAI-Android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: DichVideoAI-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DichVideoAI-APK
          path: DichVideoAI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
